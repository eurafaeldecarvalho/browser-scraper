name: Release

# Publishes to npm when a version tag (v1.2.3) is pushed, using npm Trusted
# Publishing (OIDC): no NPM_TOKEN secret, and the package gets a provenance
# attestation ("Built and signed on GitHub Actions" on npmjs.com).
#
# One-time setup on npmjs.com → package → Settings → Trusted Publisher:
#   GitHub Actions · eurafaeldecarvalho/browser-scraper · workflow: release.yml

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm
      - run: npm install -g npm@latest
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - run: pnpm test
      - run: pnpm run build
      - name: Tag matches package.json
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - run: npm publish --provenance --access public
      - name: GitHub Release
        run: gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
